<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merger</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>PDF Merger</h1>
    <div class="container">
        <div class="card">
            <h2>Merge Multiple PDFs</h2>
            <p class="subtitle">
                Upload two or more PDF files and combine them into a single document.
            </p>
            <form action="/merge" method="POST" enctype="multipart/form-data">
                <input type="file"
                       name="files"
                       accept=".pdf"
                       multiple
                       required>
                <button type="submit">
                    Merge PDFs
                </button>
            </form>
            <br>
            <a href="/history">
                View History
            </a>
            {% if error %}
                <p class="warning">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
